services:

  # ── service-catalogue ──────────────────────────────────────────────────────
  service-catalogue:
    build:
      context: ./src/modules/service-catalogue
      dockerfile: Dockerfile
    container_name: pss-service-catalogue
    ports:
      - '3010:3000'
    env_file:
      - ./src/modules/service-catalogue/.env
    environment:
      DB_HOST: postgres-catalogue
    depends_on:
      postgres-catalogue:
        condition: service_healthy
    networks:
      - pss-network
    restart: unless-stopped

  postgres-catalogue:
    image: postgres:16-alpine
    container_name: pss-postgres-catalogue
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: steph123gd
      POSTGRES_DB: service-catalogue-db
    ports:
      - '5442:5432'
    volumes:
      - postgres_catalogue_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pss-network

  # ── kpi-sla ────────────────────────────────────────────────────────────────
  kpi-sla:
    build:
      context: ./src/modules/kpi-sla
      dockerfile: Dockerfile
    container_name: pss-kpi-sla
    ports:
      - '3011:3001'
    env_file:
      - ./src/modules/kpi-sla/.env
    environment:
      DB_HOST: postgres-kpi-sla
      SERVICE_CATALOGUE_URL: http://service-catalogue:3000
    depends_on:
      postgres-kpi-sla:
        condition: service_healthy
      service-catalogue:
        condition: service_started
    networks:
      - pss-network
    restart: unless-stopped

  postgres-kpi-sla:
    image: postgres:16-alpine
    container_name: pss-postgres-kpi-sla
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: steph123gd
      POSTGRES_DB: kpi-sla-db
    ports:
      - '5443:5432'
    volumes:
      - postgres_kpi_sla_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pss-network

  # ── commitment ──────────────────────────────────────────────────────────────
  commitment:
    build:
      context: ./src/modules/commitment
      dockerfile: Dockerfile
    container_name: pss-commitment
    ports:
      - '3012:3002'
    env_file:
      - ./src/modules/commitment/.env
    environment:
      DB_HOST: postgres-commitment
      SERVICE_CATALOGUE_URL: http://service-catalogue:3000
      KPI_SLA_URL: http://kpi-sla:3001
    depends_on:
      postgres-commitment:
        condition: service_healthy
      service-catalogue:
        condition: service_started
      kpi-sla:
        condition: service_started
    networks:
      - pss-network
    restart: unless-stopped

  postgres-commitment:
    image: postgres:16-alpine
    container_name: pss-postgres-commitment
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: steph123gd
      POSTGRES_DB: commitment-db
    ports:
      - '5444:5432'
    volumes:
      - postgres_commitment_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pss-network

  # ── frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pss-frontend
    ports:
      - '5174:5174'
    environment:
      PROXY_CATALOGUE_URL: http://service-catalogue:3000
      PROXY_KPI_SLA_URL: http://kpi-sla:3001
      PROXY_COMMITMENT_URL: http://commitment:3002
    volumes:
      - ../src:/app/src
    depends_on:
      - service-catalogue
      - kpi-sla
      - commitment
    networks:
      - pss-network
    restart: unless-stopped

  # ── pgAdmin (database viewer) ───────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pss-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pss.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - '5051:5050'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    depends_on:
      postgres-catalogue:
        condition: service_healthy
      postgres-kpi-sla:
        condition: service_healthy
      postgres-commitment:
        condition: service_healthy
    networks:
      - pss-network
    restart: unless-stopped

volumes:
  postgres_catalogue_data:
  postgres_kpi_sla_data:
  postgres_commitment_data:
  pgadmin_data:

networks:
  pss-network:
    driver: bridge
