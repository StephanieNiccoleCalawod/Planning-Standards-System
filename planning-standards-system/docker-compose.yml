version: '3.9'

services:

  # ── service-catalogue ──────────────────────────────────────────────────────
  service-catalogue:
    build:
      context: ./src/modules/service-catalogue
      dockerfile: Dockerfile
    container_name: pss-service-catalogue
    ports:
      - '3000:3000'
    env_file:
      - ./src/modules/service-catalogue/.env
    environment:
      DB_HOST: postgres-catalogue
    depends_on:
      postgres-catalogue:
        condition: service_healthy
    networks:
      - pss-network
    restart: unless-stopped

  postgres-catalogue:
    image: postgres:16-alpine
    container_name: pss-postgres-catalogue
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service-catalogue-db
    ports:
      - '5432:5432'
    volumes:
      - postgres_catalogue_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pss-network

  # ── kpi-sla ────────────────────────────────────────────────────────────────
  kpi-sla:
    build:
      context: ./src/modules/kpi-sla
      dockerfile: Dockerfile
    container_name: pss-kpi-sla
    ports:
      - '3001:3001'
    env_file:
      - ./src/modules/kpi-sla/.env
    environment:
      DB_HOST: postgres-kpi-sla
      SERVICE_CATALOGUE_URL: http://service-catalogue:3000
    depends_on:
      postgres-kpi-sla:
        condition: service_healthy
      service-catalogue:
        condition: service_started
    networks:
      - pss-network
    restart: unless-stopped

  postgres-kpi-sla:
    image: postgres:16-alpine
    container_name: pss-postgres-kpi-sla
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kpi-sla-db
    ports:
      - '5433:5432'
    volumes:
      - postgres_kpi_sla_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pss-network

volumes:
  postgres_catalogue_data:
  postgres_kpi_sla_data:

networks:
  pss-network:
    driver: bridge
